[project]
name = "pybotters-insiders"
version = "0.1.0"
description = "EXPERIMENTAL PACKAGE FOR PYBOTTERS V2"
readme = "README.md"
authors = [
    { name = "MtkN1", email = "51289448+MtkN1@users.noreply.github.com" },
]
requires-python = ">=3.10"
dependencies = []

[build-system]
requires = ["uv_build>=0.7.19,<1.0.0"]
build-backend = "uv_build"

[dependency-groups]
ci = [
    "pytest-github-actions-annotate-failures>=0.4.0",
]
dev = [
    { include-group = "ide" },
    { include-group = "lint" },
    { include-group = "test" },
]
ide = [
    "pytest-cov>=7.1.0",
]
lint = [
    "ruff>=0.15.0",
]
test = [
    "coverage[toml]>=7.13.0",
    "pytest>=9.0.0",
]

[tool.coverage.run]
branch = true
source = ["src", "tests"]
dynamic_context = "test_function"

[tool.coverage.report]
exclude_also = [
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]
fail_under = 100
show_missing = true
skip_empty = true
skip_covered = true

[tool.coverage.html]
skip_empty = true
show_contexts = true

[tool.pyright]
typeCheckingMode = "strict"
include = ["src", "tests"]

[tool.pytest]
testpaths = ["tests"]
verbosity_assertions = "2"
verbosity_subtests = "1"
verbosity_test_cases = "2"

[tool.ruff]
include = ["pyproject.toml", "src/**/*.py", "tests/**/*.py"]

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
explicit-preview-rules = true
future-annotations = true
select = [
    "ALL",
    "PLC2701",
]
ignore = [
    "D203",
    "D213",
    "W191",
    "E111",
    "E114",
    "E117",
    "D206",
    "D300",
    "Q000",
    "Q001",
    "Q002",
    "Q003",
    "COM812",
    "COM819",
]
preview = true

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "S101",
    "PLR2004",
]
